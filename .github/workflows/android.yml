name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versión firmada para Obtainium, por ejemplo v0.1.0 (vacío = APK de prueba)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rosario
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile test APK
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Upload test APK
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: Rosario-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Validate release name
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}
        env:
          RELEASE_TAG: ${{ inputs.release_version || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || {
            echo "::error::Use a version like v0.1.0"; exit 1;
          }

      - name: Restore stable signing key
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ROSARIO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROSARIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROSARIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROSARIO_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ||
                -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure all four ROSARIO signing secrets before publishing an APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rosario-release.jks"

      - name: Build signed release
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}
        env:
          ROSARIO_KEYSTORE_FILE: ${{ runner.temp }}/rosario-release.jks
          ROSARIO_KEYSTORE_PASSWORD: ${{ secrets.ROSARIO_KEYSTORE_PASSWORD }}
          ROSARIO_KEY_ALIAS: ${{ secrets.ROSARIO_KEY_ALIAS }}
          ROSARIO_KEY_PASSWORD: ${{ secrets.ROSARIO_KEY_PASSWORD }}
          ROSARIO_VERSION: ${{ inputs.release_version || github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_version || github.ref_name }}
        run: |
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk "Rosario-${RELEASE_TAG}.apk"

      - name: Publish APK for Obtainium
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}
        uses: softprops/action-gh-release@v2
        with:
          files: Rosario-*.apk
          tag_name: ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
