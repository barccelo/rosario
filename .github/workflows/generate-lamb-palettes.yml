name: Generate themed Lamb of God assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_lamb_palettes.py'
      - '.github/workflows/generate-lamb-palettes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rosario
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6

      - name: Generate static variants and validate transparency
        run: python scripts/generate_lamb_palettes.py

      - name: Commit static images for Android and web
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rosary-lamb-palettes
          if git diff --cached --quiet; then
            echo "Palette assets already up to date"
            exit 0
          fi
          git commit -m "Store approved illustration outline variants for every Rosario theme"
          git push origin HEAD:main
